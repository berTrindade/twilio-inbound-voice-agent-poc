[tool.poetry]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent — FastAPI WebSocket server for running voice surveys"
authors = ["Voice agent contributors"]
readme = "README.md"
packages = [{include = "voice_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.120.0"
starlette = "^0.49.1"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
sqlalchemy = "^2.0.44"
alembic = "^1.17.1"
psycopg2-binary = "^2.9.11"
opentelemetry-api = "^1.38.0"
opentelemetry-sdk = "^1.38.0"
opentelemetry-instrumentation-fastapi = "^0.59b0"
opentelemetry-instrumentation-asyncio = "^0.59b0"
opentelemetry-instrumentation-requests = "^0.59b0"
opentelemetry-instrumentation-urllib3 = "^0.59b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.38.0"
opentelemetry-semantic-conventions = "^0.59b0"
psutil = "^6.1.0"
python-dotenv = "^1.1.1"
requests = "^2.32.5"
python-dateutil = "^2.9.0.post0"
twilio = "^9.10.2"
python-multipart = "^0.0.22"
cryptography = "^46.0.7"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
ruff = "^0.14.4"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
freezegun = "^1.5.5"

[tool.ruff.lint]
# Dead-code rules only: unused imports, redefinitions, unused locals. Layout is
# black's job, and a full ruleset on a codebase black already formats would be
# noise rather than signal.
select = ["F401", "F811", "F841"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real services (Ollama by default) - run explicitly with -m live",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
